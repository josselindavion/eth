# Order for the EDM machine (AgieCharmilles CUT E 350) made from the lab plan ETH_450x400_3_SHEET_v20250520.
# Specimens read in the 2025 drawing (ETH_450x400_3_SHEET_v20250520.dxf / .pdf, not kept in the repository), old
# models with straight
# grips, replaced by the lab catalogue models with the "Christmas tree" grips; same angles and same notch codes
# (index 1, 2, 3):
#   UT_L140 (140 mm)  -> UT40 (106 mm)     NT_R20.00 -> NT20     NT_R6.67 -> NT06     CH_D4.8 / D5.0 -> CHD48
#   DISC_0H -> MNAK_RECT_FULL              DISC_2H (holes at 0 / 135 / 90 deg) -> MNAK_RECT_HOLE at 90 / 45 / 0 deg
#   (rectangular Mini-Nakajima instead of the discs, user 03/11/2026; holes oriented as on the disc)
#   STRIP_140x30 -> LASER (no code)
# Run from the repository root:
#   py cutting-sheets/scripts/make_plan.py cutting-sheets/orders/ETH_450x400_3_SHEET_v20250520.yaml

name: ETH_450x400_3_SHEET_v20250520_EDM         # name of the plan: output folder, DXF and notice
templates: catalogue/CTLG_261102              # templates without code: lab catalogue (+ MNAK_RECT)

# ---------- Sheet on the EDM machine (AgieCharmilles CUT E 350); all lengths in mm; see preview.png ----------
sheet: 300x400         # complete sheet, RD x TD: rolling direction first (required)
clamping:              # bands of the sheet held by the clamps, per side (left / bottom / right / top); here L-shaped
  left: 40             #   clamped band on the left edge of the sheet
  bottom: 40           #   clamped band on the bottom edge (bottom = start of the rolling direction)
machine_area: 250x350  # area the wire can reach, RD x TD = Y x X travel of the CUT E 350; it starts at the inner
                       #   corner of the clamping, unless machine_position: {left: .., bottom: ..} is given
placement_margin: 5    # the sheet is not positioned to the mm: nothing is placed within 5 mm of the machine area edge
edge_margin: 5         # minimum distance between a specimen and a free (not clamped) edge of the sheet
gap: 5                 # minimum distance between two specimens (rule of the supervisors)
# -> effective area (where the specimens go) = machine area - placement margin = 240 (RD) x 340 (TD) mm from x 45, y 45

# ---------- Placement (time budget) ----------
assign_time: 30        # seconds of PackingSolver to put all the specimens on sheets (step 1)
fill_tries: 8          # failed tries allowed when moving specimens to empty one sheet (step 2; 0 = no reduction)
fill_time: 10          # seconds of sparrow at most per try (a try that succeeds usually stops after 1-3 s)
time: 10               # seconds of sparrow at most per sheet for the final compaction (step 3; 0 = no compaction)
seed: 1                # seed of the random draws of sparrow (change it to get another layout)
max_sheets: 20         # the order is rejected if it needs more sheets than this

# ---------- Specimens: one line = "count specimens of this type at this angle" ----------
# type: lab name of the specimen (names of 10/11/2026; the older names in brackets are still accepted)
#   long specimens 106 mm   : UT40 (UTUT), NT20, NT06, CHD48 (CHCH)
#   short specimens 81 mm   : UT19 (UTST), SHLD, SHMD, SHHD
#   round Mini-Nakajima     : MNAK_ROUND_FULL (MNAK_FULL), MNAK_ROUND_HOLE (MNAK_HOLE; holes at angle + 90 deg)
#   rectangular Nakajima    : MNAK_RECT_FULL, MNAK_RECT_HOLE (holes oriented as on the round one)
#   strip without code      : LASER (TENS_FULL), speckle contrast tests
# angle: direction of the coded end, from the rolling direction, 0-135 deg in steps of 15 (written in the notch code)
# count: number of specimens of this line
# first_index: index (number in the notch code) of the first specimen, then +1 for each one (default 0; max 9)
specimens:
  - {type: UT40,            angle: 0,   count: 3, first_index: 1}
  - {type: UT40,            angle: 15,  count: 3, first_index: 1}
  - {type: UT40,            angle: 30,  count: 3, first_index: 1}
  - {type: UT40,            angle: 45,  count: 3, first_index: 1}
  - {type: UT40,            angle: 60,  count: 3, first_index: 1}
  - {type: UT40,            angle: 75,  count: 3, first_index: 1}
  - {type: UT40,            angle: 90,  count: 3, first_index: 1}
  - {type: NT20,            angle: 0,   count: 3, first_index: 1}
  - {type: NT20,            angle: 45,  count: 3, first_index: 1}
  - {type: NT20,            angle: 90,  count: 3, first_index: 1}
  - {type: NT06,            angle: 0,   count: 3, first_index: 1}
  - {type: NT06,            angle: 45,  count: 3, first_index: 1}
  - {type: NT06,            angle: 90,  count: 3, first_index: 1}
  - {type: CHD48,           angle: 0,   count: 3, first_index: 1}
  - {type: CHD48,           angle: 45,  count: 3, first_index: 1}
  - {type: CHD48,           angle: 90,  count: 3, first_index: 1}
  - {type: MNAK_RECT_FULL,  angle: 0,   count: 3, first_index: 1}
  - {type: MNAK_RECT_HOLE,  angle: 90,  count: 3, first_index: 1}   # holes along the rolling direction
  - {type: MNAK_RECT_HOLE,  angle: 45,  count: 3, first_index: 1}   # holes at 135 deg
  - {type: MNAK_RECT_HOLE,  angle: 0,   count: 3, first_index: 1}   # holes across the rolling direction
  - {type: LASER,           angle: 90,  count: 6}
  - {type: LASER,           angle: 90,  count: 5}   # extra strips to fill the space left on the sheets (estimate)
