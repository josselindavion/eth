# Example order: one line = "N specimens of this type at this angle".
# Run:  py cutting-sheets/scripts/make_plan.py cutting-sheets/orders/example.yaml

name: ETH_400x300mm_SHEET_v20261103_example   # name of the plan (output folder, DXF, notice)
templates: templates/CTLG_261102              # lab catalogue + rectangular Mini-Nakajima (MNAK_RECT)
# Sheet on the EDM machine (AgieCharmilles CUT E 350); all in mm, see preview.png for the zones
sheet: 400x300         # complete sheet, width x height; the height is the rolling direction
clamping:              # L-shaped clamping: bands of the sheet held by the clamps
  left: 40
  bottom: 40           #   bottom = start of the rolling direction
machine_area: 350x250  # area the wire can reach (X x Y travel of the CUT E 350), from the inner corner of the clamping
placement_margin: 5    # the sheet is not positioned to the mm: nothing is placed within 5 mm of the machine area edge
edge_margin: 5         # minimum distance to a free edge of the sheet
gap: 5                 # mm between two specimens (rule of the supervisors)
assign_time: 30        # seconds of PackingSolver to put the specimens on sheets
fill_tries: 8          # failed tries allowed when moving specimens to empty one sheet (0 = no reduction)
fill_time: 10          # seconds of sparrow at most per try (a try that succeeds usually stops after 1-3 s)
time: 10               # seconds of sparrow at most per sheet for the final compaction (0 = no compaction)

# Optional: fields of the full specimen ID (lab QR code), copied into registry.csv
specimen_id:
  batch: 240702AA
  sample_geometry: MTS0
  additional: AA
  test_geometry: {UTUT: UTUT, NT20: NT20}     # 4 characters per type (to confirm with the lab)

# type (names of the lab catalogue):
#   long specimens 106 mm   : UTUT (or UT), NT20, NT06 (or NT6.67), CHCH (or CH)
#   short specimens 81 mm   : UTST, SHLD, SHMD, SHHD
#   discs                   : MNAK_FULL (or DISC0), MNAK_HOLE (or DISC2; holes at angle + 90 deg)
#   rectangular Nakajima    : MNAK_RECT_FULL, MNAK_RECT_HOLE (or MNAK_RECT; holes oriented as on the disc)
#   strip without code      : TENS_FULL (or STRIP)
# angle: of the coded end, from the rolling direction, 0-135 deg in steps of 15
# count: how many; index (number in the code) = 0, 1, 2... (0-9) unless first_index is given
specimens:
  - {type: UTUT, angle: 30,  count: 5}
  - {type: NT20, angle: 45,  count: 3}
  - {type: UTST, angle: 0,   count: 2}
  - {type: SHLD, angle: 135, count: 2}
  - {type: MNAK_HOLE, angle: 90, count: 2}
