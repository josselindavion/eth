# Campaign B, sheet 3, variant for the large sheets (RA980 900x1200, RA1200 913x1146, CR1200Y1500T 916x1267; user
# 12/11/2026): the same 68 specimens as sheet 3 of B (sheet 2 of AB_SHEETS23, same codes), on the strip of 300 (RD) x
# 1146 (TD) left above the two 600x500 blanks. The classic sheet 3 stays for the 600x500 sheets.
# Written by scripts/orders_from_registry.py: specimens of sheet(s) 2 of the plan AB_SHEETS23_600x500mm_WATERJET (codes kept);
# 68 specimens + 0 LASER strips.
# Run from the repository root:
#   py cutting-sheets/scripts/make_plan.py cutting-sheets/orders/B_SHEET3_LARGE_300x1146mm_WATERJET.yaml

name: B_SHEET3_LARGE_300x1146mm_WATERJET
templates: catalogue/CTLG_261102              # templates without code: lab catalogue (+ MNAK_RECT)

# ---------- Sheet on the waterjet machine; all lengths in mm; see preview.png ----------
sheet: 300x1146        # strip of a large sheet, RD x TD: rolling direction first (required); 300 x 1146 = the
                       #   strip left above the two 600 x 500 blanks on all three large sheets (smallest RD
                       #   left 900 - 600 = 300, smallest TD 1146)
clamps:                # the clamps of the L (user, 10/11/2026) that fall on the strip: the left clamp at 475 is
                       #   off the strip (300 mm high); 1 on the left edge, 2 on the bottom edge
                       #   at = centre of the clamp, in mm from the bottom-left corner along that edge;
                       #   width = along the edge, depth = into the sheet (40 = depth of the L)
  - {side: left,   at: 175, width: 50, depth: 40}
  - {side: bottom, at: 140, width: 50, depth: 40}
  - {side: bottom, at: 375, width: 50, depth: 40}
clamp_margin: 5        # minimum distance between a specimen and a clamp (room for the waterjet nozzle)
edge_margin: 5         # minimum distance to the edges of the sheet (also between the clamps)
placement_margin: 5    # 5 mm more between the really usable area and the area used for the specimens
gap: 5                 # minimum distance between two specimens (rule of the supervisors)
# -> effective area (where the specimens go) = 280 (RD) x 1126 (TD) mm from x 10, y 10, minus a zone of 70 mm (along
#    the edge) x 50 mm (into the sheet) around each clamp (clamp + clamp_margin + placement_margin)

# ---------- Placement (time budget) ----------
assign_time: 30        # seconds of PackingSolver to put all the specimens on sheets (step 1)
fill_tries: 8          # failed tries allowed when moving specimens to empty one sheet (step 2; 0 = no reduction)
fill_time: 15          # seconds of sparrow at most per try (a try that succeeds usually stops after 1-3 s)
time: 15               # seconds of sparrow at most per sheet for the final compaction (step 3; 0 = no compaction)
seed: 1                # seed of the random draws of sparrow (change it to get another layout)
max_sheets: 20         # the order is rejected if it needs more sheets than this
spread_distance: 10    # two repeats (same type and angle) closer than this (mm) are "side by side": swaps
                       #   separate them after the placement; the pairs left are a warning (orange circles)
spread_tries: 3        # 3 placements tried (fewest sheets kept): 1 strip must be reached
                       #   (seed, seed + 1, ...; best kept: fewest sheets, then fewest pairs); time x tries

# ---------- Specimens: one line = "count specimens of this type at this angle" ----------
# type: lab name of the specimen (names of 10/11/2026; the older names in brackets are still accepted)
#   long specimens 106 mm   : UT40 (UTUT), NT20, NT06, CHD48 (CHCH)
#   short specimens 81 mm   : UT19 (UTST), SHLD, SHMD, SHHD
#   round Mini-Nakajima     : MNAK_ROUND_FULL (MNAK_FULL), MNAK_ROUND_HOLE (MNAK_HOLE; holes at angle + 90 deg)
#   rectangular Nakajima    : MNAK_RECT_FULL, MNAK_RECT_HOLE (holes oriented as on the round one)
#   strip without code      : LASER (TENS_FULL), speckle contrast tests
# angle: direction of the coded end, from the rolling direction, 0-135 deg in steps of 15 (written in the notch code)
# count: number of specimens of this line
# first_index: index (number in the notch code) of the first specimen, then +1 for each one (default 0; max 9)
specimens:
  # from sheet(s) 2 of cutting-sheets/runs/AB_SHEETS23_600x500mm_WATERJET/registry.csv
  - {type: CHD48,           angle: 0,   count: 1, first_index: 9}
  - {type: CHD48,           angle: 45,  count: 2, first_index: 4}
  - {type: CHD48,           angle: 45,  count: 3, first_index: 7}
  - {type: CHD48,           angle: 90,  count: 1, first_index: 5}
  - {type: CHD48,           angle: 90,  count: 3, first_index: 7}
  - {type: NT06,            angle: 0,   count: 1, first_index: 4}
  - {type: NT06,            angle: 45,  count: 4, first_index: 6}
  - {type: NT06,            angle: 90,  count: 4, first_index: 6}
  - {type: NT20,            angle: 0,   count: 1, first_index: 9}
  - {type: NT20,            angle: 45,  count: 1, first_index: 5}
  - {type: NT20,            angle: 45,  count: 1, first_index: 9}
  - {type: NT20,            angle: 90,  count: 1, first_index: 5}
  - {type: UT19,            angle: 0,   count: 2, first_index: 8}
  - {type: UT19,            angle: 15,  count: 2, first_index: 8}
  - {type: UT19,            angle: 30,  count: 3, first_index: 7}
  - {type: UT19,            angle: 45,  count: 3, first_index: 7}
  - {type: UT19,            angle: 60,  count: 1, first_index: 9}
  - {type: UT19,            angle: 75,  count: 2, first_index: 8}
  - {type: UT19,            angle: 90,  count: 3, first_index: 7}
  - {type: UT40,            angle: 0,   count: 1, first_index: 6}
  - {type: UT40,            angle: 15,  count: 1, first_index: 6}
  - {type: UT40,            angle: 75,  count: 1, first_index: 6}
  - {type: UT40,            angle: 90,  count: 1, first_index: 6}
  - {type: SHHD,            angle: 0,   count: 2, first_index: 1}
  - {type: SHHD,            angle: 0,   count: 2, first_index: 4}
  - {type: SHHD,            angle: 0,   count: 2, first_index: 7}
  - {type: SHLD,            angle: 0,   count: 1, first_index: 2}
  - {type: SHLD,            angle: 0,   count: 2, first_index: 4}
  - {type: SHLD,            angle: 0,   count: 2, first_index: 7}
  - {type: SHMD,            angle: 0,   count: 2, first_index: 4}
  - {type: SHMD,            angle: 0,   count: 2, first_index: 7}
  - {type: SHMD,            angle: 45,  count: 1, first_index: 2}
  - {type: SHMD,            angle: 45,  count: 2, first_index: 4}
  - {type: SHMD,            angle: 45,  count: 2, first_index: 7}
  - {type: SHMD,            angle: 90,  count: 1, first_index: 2}
  - {type: SHMD,            angle: 90,  count: 2, first_index: 4}
  - {type: SHMD,            angle: 90,  count: 2, first_index: 7}
