# Module A_LARGE: campaign A on one large sheet (= SLOW78 + MEDHIGH66 medium + MEDHIGH66 high), waterjet, sheets of 900 (RD) x 1140 (TD) mm.
# Written by scripts/make_module_orders.py (modular strategy, user 12/11/2026): 210 specimens + 4 LASER.
# Index of the notch code = strain rate: slow 1-3, medium 4-6, high 7-9 (shear: 1-2, 4-5, 7-8).
# Run from the repository root:
#   py cutting-sheets/scripts/make_plan.py cutting-sheets/orders/modules/MOD_A_LARGE_900x1140mm_WATERJET.yaml

name: MOD_A_LARGE_900x1140mm_WATERJET
templates: catalogue/CTLG_261102              # templates without code: lab catalogue (+ MNAK_RECT)

# ---------- Sheet on the waterjet machine; all lengths in mm; see preview.png ----------
sheet: 900x1140       # complete sheet, RD x TD: rolling direction first (required)
clamps:                # 7 single clamps 50 x 40 (user, 12/11/2026): 2 on each short side (left, right),
                       #   spread at 300 and 600 mm; 3 on the long bottom side, spread at 285, 570, 855 mm
  - {side: left,   at: 300, width: 50, depth: 40}
  - {side: left,   at: 600, width: 50, depth: 40}
  - {side: right,  at: 300, width: 50, depth: 40}
  - {side: right,  at: 600, width: 50, depth: 40}
  - {side: bottom, at: 285, width: 50, depth: 40}
  - {side: bottom, at: 570, width: 50, depth: 40}
  - {side: bottom, at: 855, width: 50, depth: 40}
clamp_margin: 5        # minimum distance between a specimen and a clamp (room for the waterjet nozzle)
edge_margin: 5         # minimum distance to the edges of the sheet (also between the clamps)
placement_margin: 5    # 5 mm more between the really usable area and the area used for the specimens
gap: 5                 # minimum distance between two specimens (rule of the supervisors)
# -> effective area: see preview.png (zones of the sheet)

# ---------- Placement (time budget) ----------
assign_time: 30        # seconds of PackingSolver to put all the specimens on sheets (step 1)
fill_tries: 8          # failed tries allowed when moving specimens to empty one sheet (step 2; 0 = no reduction)
fill_time: 10          # seconds of sparrow at most per try (a try that succeeds usually stops after 1-3 s)
time: 30               # seconds of sparrow at most per sheet for the final compaction (step 3; 0 = no compaction)
seed: 1                # seed of the random draws of sparrow (change it to get another layout)
max_sheets: 20         # the order is rejected if it needs more sheets than this
spread_distance: 10    # two repeats (same type and angle) closer than this (mm) are "side by side": swaps
                       #   separate them after the placement; the pairs left are a warning (orange circles)
spread_tries: 3        # 3 placements tried: seed 1, 2, 3
                       #   (seed, seed + 1, ...; best kept: fewest sheets, then fewest pairs); time x tries

# ---------- Specimens: one line = "count specimens of this type at this angle" ----------
# type: lab name of the specimen (names of 10/11/2026; the older names in brackets are still accepted)
#   long specimens 106 mm   : UT40 (UTUT), NT20, NT06, CHD48 (CHCH)
#   short specimens 81 mm   : UT19 (UTST), SHLD, SHMD, SHHD
#   round Mini-Nakajima     : MNAK_ROUND_FULL (MNAK_FULL), MNAK_ROUND_HOLE (MNAK_HOLE; holes at angle + 90 deg)
#   rectangular Nakajima    : MNAK_RECT_FULL, MNAK_RECT_HOLE (holes oriented as on the round one)
#   strip without code      : LASER (TENS_FULL), speckle contrast tests
# angle: direction of the coded end, from the rolling direction, 0-135 deg in steps of 15 (written in the notch code)
# count: number of specimens of this line
# first_index: index (number in the notch code) of the first specimen, then +1 for each one (default 0; max 9)
specimens:
  # slow rate
  - {type: UT40,            angle: 0,   count: 3, first_index: 1}
  - {type: UT40,            angle: 15,  count: 3, first_index: 1}
  - {type: UT40,            angle: 30,  count: 3, first_index: 1}
  - {type: UT40,            angle: 45,  count: 3, first_index: 1}
  - {type: UT40,            angle: 60,  count: 3, first_index: 1}
  - {type: UT40,            angle: 75,  count: 3, first_index: 1}
  - {type: UT40,            angle: 90,  count: 3, first_index: 1}
  - {type: NT20,            angle: 0,   count: 3, first_index: 1}
  - {type: NT20,            angle: 45,  count: 3, first_index: 1}
  - {type: NT20,            angle: 90,  count: 3, first_index: 1}
  - {type: NT06,            angle: 0,   count: 3, first_index: 1}
  - {type: NT06,            angle: 45,  count: 3, first_index: 1}
  - {type: NT06,            angle: 90,  count: 3, first_index: 1}
  - {type: CHD48,           angle: 0,   count: 3, first_index: 1}
  - {type: CHD48,           angle: 45,  count: 3, first_index: 1}
  - {type: CHD48,           angle: 90,  count: 3, first_index: 1}
  - {type: MNAK_RECT_FULL,  angle: 0,   count: 3, first_index: 1}
  - {type: MNAK_RECT_HOLE,  angle: 0,   count: 3, first_index: 1}
  - {type: MNAK_RECT_HOLE,  angle: 45,  count: 3, first_index: 1}
  - {type: MNAK_RECT_HOLE,  angle: 90,  count: 3, first_index: 1}
  - {type: SHLD,            angle: 0,   count: 2, first_index: 1}
  - {type: SHLD,            angle: 45,  count: 2, first_index: 1}
  - {type: SHLD,            angle: 90,  count: 2, first_index: 1}
  - {type: SHMD,            angle: 0,   count: 2, first_index: 1}
  - {type: SHMD,            angle: 45,  count: 2, first_index: 1}
  - {type: SHMD,            angle: 90,  count: 2, first_index: 1}
  - {type: SHHD,            angle: 0,   count: 2, first_index: 1}
  - {type: SHHD,            angle: 45,  count: 2, first_index: 1}
  - {type: SHHD,            angle: 90,  count: 2, first_index: 1}
